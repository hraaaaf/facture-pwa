name: Step 6 Bootstrap

on:
  push:
    branches: [feat/import-guards]
    paths:
      - scripts/step6-bootstrap.mjs
      - .github/workflows/step6-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-guards
      - name: Apply deterministic Step 6 patch
        run: node scripts/step6-bootstrap.mjs
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Apply Step 6 import guardrails [skip ci]"
          git push origin HEAD:feat/import-guards
