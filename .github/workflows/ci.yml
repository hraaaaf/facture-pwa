name: CI

# Workflow manuel par défaut. Le trigger push ci-dessous est volontairement
# limité à CE fichier pour permettre un unique run de certification à la
# création de ce commit, sans réactiver les runs sur les changements produit.
on:
  workflow_dispatch:
  push:
    branches:
      - m0/pwa-foundation
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests + exact-head PDF artifacts
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload exact-head PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-pdfs
          path: artifacts/pdf/*.pdf
          if-no-files-found: ignore
          retention-days: 3
