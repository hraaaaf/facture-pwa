name: F2 Input Extractors Certification

on:
  push:
    branches:
      - f2/input-extractors

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Real binary fixtures in Chromium
        run: node scripts/f2-runtime-certification.mjs
