name: Final Runtime Certification

on:
  push:
    branches:
      - m0/pwa-foundation
    paths:
      - certification/.run-final-v4

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app
        run: npm install --no-audit --no-fund
      - name: Verify PDF dependency versions
        run: npm ls jspdf jspdf-autotable
      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Unit tests
        run: npm test
      - name: Build exact HEAD
        run: npm run build
      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Runtime certification
        run: node scripts/final-certification-v4.mjs
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-certification-v4
          path: |
            artifacts/final-certification-v4
            artifacts/pdf
          if-no-files-found: error
          retention-days: 5
