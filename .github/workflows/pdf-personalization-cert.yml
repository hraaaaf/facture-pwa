name: PDF Personalization Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/PreviewV2.tsx'
      - 'src/pdfThemes.ts'
      - 'src/pdfPersonalizedBase.ts'
      - 'src/pdfDisplayOptions.ts'
      - 'src/pdfDisplayOptions.test.ts'
      - 'src/pdfPersonalization.test.ts'
      - 'src/pdf-personalization.css'
      - 'scripts/pdf-personalization-certification.mjs'
      - '.github/workflows/pdf-personalization-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build feature
        run: npm run build
      - name: Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build main baseline
        run: |
          rm -rf /tmp/facture-main
          mkdir -p /tmp/facture-main
          git archive origin/main | tar -x -C /tmp/facture-main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/facture-main/node_modules
          (cd /tmp/facture-main && npm run build)
      - name: Browser BEFORE AFTER certification
        run: timeout --signal=TERM --kill-after=5s 180s node scripts/pdf-personalization-certification.mjs /tmp/facture-main .
      - name: Verify proof
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const r=JSON.parse(fs.readFileSync('artifacts/pdf-personalization/report.json','utf8'))
          if(r.failure) throw new Error(r.failure)
          if(!Array.isArray(r.assertions)||r.assertions.length!==7||r.assertions.some(x=>!x.ok)) throw new Error('PDF personalization assertions incomplete')
          for(const w of [390,430,768,1280]) for(const p of ['before','after']) if(!fs.existsSync(`artifacts/pdf-personalization/${p}-${w}.png`)) throw new Error(`Missing ${p}-${w}`)
          if(!fs.existsSync('artifacts/pdf-personalization/after-customized-390.png')) throw new Error('Missing customized proof')
          console.log('PDF PERSONALIZATION REPORT VERIFIED: 7/7')
          NODE
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-personalization-before-after
          path: artifacts/pdf-personalization
          if-no-files-found: error
          retention-days: 5
