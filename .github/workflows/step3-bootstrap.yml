name: Step 3 Bootstrap
on:
  push:
    branches: [feat/invoice-payment-lifecycle]
    paths:
      - 'scripts/apply-step3-payment-lifecycle.py'
      - '.github/workflows/step3-bootstrap.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/invoice-payment-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: python scripts/apply-step3-payment-lifecycle.py
      - name: Install and test candidate
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Commit candidate
        run: |
          git config user.name 'hraaaaf'
          git config user.email '123034021+hraaaaf@users.noreply.github.com'
          git add src/types.ts src/lib.ts src/storage.ts src/App.tsx src/paymentLifecycle.ts src/paymentLifecycle.test.ts src/payment-lifecycle.css scripts/payment-lifecycle-certification.mjs .github/workflows/payment-lifecycle-cert.yml docs/FUNCTIONAL_AUDIT_REMEDIATION.md
          git diff --cached --exit-code && exit 0
          git commit -m 'Add invoice payment lifecycle'
          git push origin HEAD:feat/invoice-payment-lifecycle
