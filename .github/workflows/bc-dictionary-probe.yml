name: BC Dictionary Runtime Probe

on:
  push:
    branches:
      - probe/bc-dictionary-runtime

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run BC dictionary probe
        run: node scripts/bc-dictionary-probe.mjs
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-dictionary-probe
          path: artifacts/bc-dictionary-probe
